# Runtime configuration (PLAT-06). Every key can be overridden by an environment variable using
# Spring relaxed binding, e.g. SERVER_PORT, SPRING_DATASOURCE_URL, LOAN_BUREAU_MOCK, LOAN_REGION_ID.
spring.application.name=loan-service

server.port=${PORT:8080}
server.servlet.context-path=/loan-service
# Parity with the legacy Tomcat 9 deployment: relative redirects (/loan-service -> /loan-service/),
# a default servlet so unmapped paths still pass through SecurityHeadersFilter, and Tomcat's
# standard error report (server version hidden; see LegacyWebConfig).
server.tomcat.use-relative-redirects=true
server.servlet.register-default-servlet=true
server.error.include-stacktrace=always

# Default: in-memory H2 2.x. Setting DB_HOST switches to PostgreSQL / Aurora (PLAT-04); see
# config/DatabaseEnvironmentPostProcessor, which also turns off the schema.sql/data.sql reload there.
spring.datasource.url=jdbc:h2:mem:loansvc;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
# H2 only: the legacy DbUtil ran schema.sql/data.sql on every start (both idempotent).
spring.sql.init.mode=always

# PostgreSQL: Flyway owns schema + seed (db/migration). Enabled only by SPRING_FLYWAY_ENABLED=true,
# which the task definition sets in the primary region only (DDL is not write-forwarded).
spring.flyway.enabled=false
spring.flyway.schemas=loan_svc
spring.flyway.locations=classpath:db/migration

# Pool and driver timeouts (RES-02). Socket/statement timeouts apply to PostgreSQL.
spring.datasource.hikari.pool-name=loan-service
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=120000
loan.db.connect-timeout-seconds=5
loan.db.socket-timeout-seconds=30
loan.db.statement-timeout-ms=15000

# Business configuration formerly held in the static ConfigHolder map (values unchanged).
loan.bureau-mock=Y
loan.notify-enabled=Y
loan.dti-default=43
loan.dti-heloc=45
loan.fico-floor=620
loan.region-id=local
loan.region-role=${APP_REGION_ROLE:local}

# Structured JSON logs to stdout (OBS-01, PLAT-07). requestId comes from the MDC (OBS-02).
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.capitalone.loansvc=DEBUG
spring.main.banner-mode=off
