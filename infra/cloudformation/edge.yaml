AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  loan-service regional edge (one stack per active region). Internet-facing
  Application Load Balancer across two AZs with TLS (ACM certificate), HTTP to
  HTTPS redirect, an IP target group for ECS Fargate tasks, and an AWS WAF web
  ACL using AWS managed rule groups plus a rate limit. Only ports 80/443 are
  open to the internet. Controls: PLAT-02, PLAT-10, RES-11, IAC-08.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Environment }
        Parameters: [EnvironmentName, ServiceName, NetworkStackName]
      - Label: { default: Listener and target }
        Parameters:
          - CertificateArn
          - TlsPolicy
          - ContainerPort
          - HealthCheckPath
          - HealthCheckMatcher
          - DeregistrationDelaySeconds
      - Label: { default: Protection and logs }
        Parameters:
          - WafRateLimitPer5Min
          - WafLogRetentionDays
          - AccessLogsBucketName
          - LoadBalancerDeletionProtection

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [integration, dev, staging, prod]
    Description: Deployment environment name. Names are prefixed ServiceName-EnvironmentName (e.g. loan-svc-integration).
  ServiceName:
    Type: String
    Default: loan-service
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Service name used in resource names.
  NetworkStackName:
    Type: String
    Description: Name of the network.yaml stack in this region.
  CertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:acm:[a-z0-9-]+:\\d{12}:certificate/.+$"
    Description: >-
      ACM certificate ARN in this region for the service hostname. Required for
      production (PLAT-02). Empty = integration-only gap: the ALB serves plain
      HTTP on port 80 (still behind WAF) and no port 443 listener is created.
  TlsPolicy:
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06
    AllowedValues:
      - ELBSecurityPolicy-TLS13-1-2-2021-06
      - ELBSecurityPolicy-TLS13-1-3-2021-06
    Description: ALB TLS policy (TLS 1.2 minimum).
  ContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1024
    MaxValue: 65535
    Description: Port the container listens on (current app 8080).
  HealthCheckPath:
    Type: String
    Default: /loan-service/
    AllowedPattern: "^/.*$"
    Description: >-
      Target group health check path. Current app /loan-service/; switch to the
      readiness endpoint (/health/ready) once Phase 5 lands (RES-01).
  HealthCheckMatcher:
    Type: String
    Default: "200"
    Description: HTTP codes treated as healthy.
  DeregistrationDelaySeconds:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 3600
    Description: Connection draining time on task stop (pairs with RES-04 graceful shutdown).
  WafRateLimitPer5Min:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: Requests per 5 minutes per client IP before WAF blocks.
  WafLogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
    Description: Retention for the WAF log group.
  AccessLogsBucketName:
    Type: String
    Default: ""
    Description: Optional existing S3 bucket for ALB access logs (bucket policy managed by the platform team).
  LoadBalancerDeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: ALB deletion protection ("false" for disposable demo stacks only).

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasAccessLogs: !Not [!Equals [!Ref AccessLogsBucketName, ""]]

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: loan-service public ALB - HTTPS and HTTP (redirect only) from the internet
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      GroupName: !Sub "${ServiceName}-${EnvironmentName}-alb"
      SecurityGroupIngress:
        - !If
          - HasCertificate
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS from internet }
          - !Ref AWS::NoValue
        - !If
          - HasCertificate
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: HTTPS from internet IPv6 }
          - !Ref AWS::NoValue
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (redirect to HTTPS when a certificate is set) }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0", Description: HTTP (redirect to HTTPS when a certificate is set) IPv6 }
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          CidrIp: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcCidr" }
          Description: To ECS tasks in the private app subnets
      Tags:
        - { Key: Name, Value: !Sub "${ServiceName}-${EnvironmentName}-alb" }

  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue { "Fn::Sub": "${NetworkStackName}-AppSecurityGroupId" }
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Container port from the regional ALB only

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-${EnvironmentName}"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split [",", !ImportValue { "Fn::Sub": "${NetworkStackName}-PublicSubnetIds" }]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: deletion_protection.enabled, Value: !Ref LoadBalancerDeletionProtection }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: routing.http.desync_mitigation_mode, Value: defensive }
        - { Key: idle_timeout.timeout_seconds, Value: "60" }
        - { Key: access_logs.s3.enabled, Value: !If [HasAccessLogs, "true", "false"] }
        - !If
          - HasAccessLogs
          - { Key: access_logs.s3.bucket, Value: !Ref AccessLogsBucketName }
          - !Ref AWS::NoValue
        - !If
          - HasAccessLogs
          - { Key: access_logs.s3.prefix, Value: !Sub "${ServiceName}-${EnvironmentName}-${AWS::Region}" }
          - !Ref AWS::NoValue
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }
        - { Key: Service, Value: !Ref ServiceName }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ServiceName}-${EnvironmentName}"
      VpcId: !ImportValue { "Fn::Sub": "${NetworkStackName}-VpcId" }
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: !Ref HealthCheckMatcher }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: !Ref DeregistrationDelaySeconds }
        - { Key: stickiness.enabled, Value: "false" }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: !Ref TlsPolicy
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # One port-80 listener whose action follows HasCertificate, so adding a
  # certificate later updates it in place instead of creating a second :80
  # listener. Without a certificate (integration-only gap) it forwards plain
  # HTTP, still behind WAF.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              Host: "#{host}"
              Path: "/#{path}"
              Query: "#{query}"
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ServiceName}-${EnvironmentName}-${AWS::Region}"
      Description: loan-service regional ALB protection - AWS managed rule groups plus rate limit
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ServiceName}-${EnvironmentName}-webacl"
      Rules:
        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation }
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesCommonRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common }
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: known-bad-inputs }
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 3
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement: { VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet }
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: sqli }
        - Name: RateLimitPerIp
          Priority: 4
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig: { SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate-limit }

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # WAF requires the aws-waf-logs- prefix.
      LogGroupName: !Sub "aws-waf-logs-${ServiceName}-${EnvironmentName}"
      RetentionInDays: !Ref WafLogRetentionDays

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs: [!GetAtt WafLogGroup.Arn]

Outputs:
  LoadBalancerArn:
    Description: Regional ALB ARN.
    Value: !Ref LoadBalancer
    Export: { Name: !Sub "${AWS::StackName}-LoadBalancerArn" }
  LoadBalancerFullName:
    Description: ALB full name (CloudWatch dimension / autoscaling resource label).
    Value: !GetAtt LoadBalancer.LoadBalancerFullName
    Export: { Name: !Sub "${AWS::StackName}-LoadBalancerFullName" }
  LoadBalancerDnsName:
    Description: ALB DNS name (Route 53 alias target and health check FQDN).
    Value: !GetAtt LoadBalancer.DNSName
    Export: { Name: !Sub "${AWS::StackName}-LoadBalancerDnsName" }
  LoadBalancerCanonicalHostedZoneId:
    Description: ALB hosted zone id (Route 53 alias target).
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
    Export: { Name: !Sub "${AWS::StackName}-LoadBalancerCanonicalHostedZoneId" }
  TargetGroupArn:
    Description: Target group ARN the ECS service registers with.
    Value: !Ref TargetGroup
    Export: { Name: !Sub "${AWS::StackName}-TargetGroupArn" }
  TargetGroupFullName:
    Description: Target group full name (CloudWatch dimension / autoscaling resource label).
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export: { Name: !Sub "${AWS::StackName}-TargetGroupFullName" }
  ListenerArn:
    Description: Listener that forwards to the target group (HTTPS, or HTTP when no certificate is set).
    Value: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]
    Export: { Name: !Sub "${AWS::StackName}-ListenerArn" }
  EdgeProtocol:
    Description: Protocol the public edge serves (HTTPS in production; HTTP is an integration-only gap).
    Value: !If [HasCertificate, HTTPS, HTTP]
    Export: { Name: !Sub "${AWS::StackName}-EdgeProtocol" }
  WebAclArn:
    Description: WAF web ACL ARN.
    Value: !GetAtt WebAcl.Arn
